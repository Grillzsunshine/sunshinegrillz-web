# ─────────────────────────────────────────────────────────────────────────────
#  Editor del sitio de Sunshine Grillz  (Sveltia CMS)
#  Aquí se define QUÉ puede editar el dueño del negocio desde /admin/.
#  Solo hay que cambiar "repo" cuando el código viva en el GitHub del cliente.
# ─────────────────────────────────────────────────────────────────────────────

backend:
  name: github
  repo: CAMBIAR-USUARIO-GITHUB/sunshinegrillz-web   # ← usuario/repositorio en GitHub
  branch: main
  # Inicio de sesión: "Sign in with GitHub" usa el proveedor OAuth de Netlify
  # (se configura una sola vez en Netlify: Access & security → OAuth → GitHub).

site_url: https://sunshinegrillz.com
display_url: https://sunshinegrillz.com
logo_url: /icons/favicon-192.png

# Dónde se guardan las fotos que se suben desde el editor
media_folder: src/img/uploads
public_folder: /img/uploads

media_libraries:
  default:
    config:
      max_file_size: 20000000          # 20 MB máx. por foto
      transformations:                 # toda foto se convierte a WebP y se reduce a 1800 px
        raster_image:
          format: webp
          quality: 85
          width: 1800
          height: 1800
        svg:
          optimize: true

# ── Las 4 "páginas" del editor ───────────────────────────────────────────────
singletons:

  - name: galeria
    label: "📸 Galería de trabajos"
    file: content/galeria.json
    fields:
      - { name: eyebrow, label: "Etiqueta pequeña", widget: string, hint: "Texto dorado sobre el título. Ej: Trabajos recientes" }
      - { name: titulo, label: "Título", widget: string }
      - { name: titulo_destacado, label: "Parte del título en dorado", widget: string, required: false, hint: "Escribe exactamente las palabras del título que quieres resaltar en cursiva dorada." }
      - { name: texto, label: "Texto de apoyo", widget: text, required: false }
      - name: fotos
        label: "Fotos"
        label_singular: "Foto"
        widget: list
        min: 1
        thumbnail: imagen
        summary: "{{titulo}}"
        collapsed: auto
        hint: "La primera foto sale más grande en el celular. Usa las flechas ↑↓ para cambiar el orden."
        fields:
          - { name: imagen, label: "Foto", widget: image }
          - { name: titulo, label: "Título corto", widget: string, hint: "Ej: Full set · plata 980" }
          - { name: descripcion, label: "Descripción (para Google)", widget: string, required: false, hint: "Una frase describiendo la foto. Ayuda a que Google te encuentre." }

  - name: negocio
    label: "🏪 Datos del negocio"
    file: content/negocio.json
    fields:
      - { name: nombre, label: "Nombre del negocio", widget: string }
      - { name: lema, label: "Lema (debajo del nombre)", widget: string, hint: "Ej: Joyería dental · Medellín" }
      - { name: logo, label: "Logo", widget: image, hint: "Cuadrado, mínimo 512×512 px. Se usa en la cabecera y como ícono del sitio." }
      - { name: whatsapp, label: "Número de WhatsApp", widget: string, pattern: ['^57\d{10}$', 'Escribe 57 seguido de tus 10 dígitos, sin +, espacios ni guiones. Ej: 573001234567'], hint: "Código de país + número, todo junto. Ej: 573246436310" }
      - { name: whatsapp_mensaje, label: "Mensaje que llega escrito al WhatsApp", widget: text, hint: "Lo que el cliente ve ya escrito cuando toca el botón." }
      - { name: instagram, label: "Usuario de Instagram", widget: string, hint: "Sin la @. Ej: sunshine._grillz" }
      - { name: ciudad, label: "Ciudad", widget: string }
      - { name: direccion, label: "Dirección (opcional)", widget: string, required: false, hint: "Solo si tienes local físico y quieres mostrarla." }
      - { name: horario, label: "Horario (opcional)", widget: string, required: false, hint: "Ej: Lun–Sáb 10am–7pm" }
      - { name: aviso_activo, label: "Mostrar aviso arriba de la página", widget: boolean, default: false, hint: "Actívalo para promociones o avisos temporales." }
      - { name: aviso_texto, label: "Texto del aviso", widget: string, required: false, hint: "Ej: 🔥 Promo de septiembre: 10% en full sets de plata" }
      - { name: seo_titulo, label: "Título para Google", widget: string, hint: "Lo que aparece como título en los resultados de Google (máx. 60 letras aprox.)." }
      - { name: seo_descripcion, label: "Descripción para Google", widget: text, hint: "El texto gris debajo del título en Google (máx. 155 letras aprox.)." }
      - { name: seo_imagen, label: "Foto al compartir el link", widget: image, hint: "La foto que sale cuando pegas el link en WhatsApp o Instagram." }
      - { name: pixel_meta, label: "Meta Pixel ID (opcional)", widget: string, required: false, hint: "Solo si pautas en Instagram/Facebook. Déjalo vacío si no." }
      - { name: google_analytics, label: "Google Analytics ID (opcional)", widget: string, required: false, hint: "Ej: G-XXXXXXXXXX. Déjalo vacío si no lo usas." }
      - { name: mostrar_credito, label: "Mostrar 'Sitio por ZeroTwelve' en el pie", widget: boolean, default: true }

  - name: textos
    label: "✍️ Textos de la página"
    file: content/textos.json
    fields:
      - name: hero
        label: "Portada"
        widget: object
        fields:
          - { name: foto, label: "Foto principal", widget: image, hint: "Vertical, buena luz. Es lo primero que ve el cliente." }
          - { name: foto_etiqueta, label: "Etiqueta sobre la foto", widget: string, required: false }
          - { name: eyebrow, label: "Etiqueta pequeña", widget: string }
          - { name: titulo, label: "Título grande", widget: string }
          - { name: titulo_destacado, label: "Parte del título en dorado", widget: string, required: false }
          - { name: texto, label: "Texto", widget: text }
          - { name: boton, label: "Texto del botón", widget: string }
          - { name: nota, label: "Nota junto al botón", widget: string, required: false }
          - name: confianza
            label: "Datos de confianza"
            label_singular: "Dato"
            widget: list
            max: 4
            hint: "Frases cortas. Ej: +14K en Instagram"
            field: { name: item, label: "Dato", widget: string }
      - name: materiales
        label: "Materiales (cinta que se mueve)"
        label_singular: "Material"
        widget: list
        field: { name: item, label: "Material", widget: string }
      - name: pasos
        label: "Cómo funciona"
        widget: object
        collapsed: true
        fields:
          - { name: eyebrow, label: "Etiqueta pequeña", widget: string }
          - { name: titulo, label: "Título", widget: string }
          - { name: titulo_destacado, label: "Parte del título en dorado", widget: string, required: false }
          - { name: texto, label: "Texto de apoyo", widget: text, required: false }
          - name: items
            label: "Pasos"
            label_singular: "Paso"
            widget: list
            min: 2
            max: 4
            summary: "{{titulo}}"
            fields:
              - { name: titulo, label: "Título del paso", widget: string }
              - { name: texto, label: "Texto", widget: text }
              - name: chips
                label: "Etiquetas"
                label_singular: "Etiqueta"
                widget: list
                required: false
                max: 3
                field: { name: item, label: "Etiqueta", widget: string }
      - name: destacados
        label: "Tarjetas destacadas"
        label_singular: "Tarjeta"
        widget: list
        collapsed: true
        min: 0
        max: 2
        summary: "{{titulo}}"
        thumbnail: imagen
        hint: "Máximo 2 tarjetas grandes con foto (ej: artistas, prensa, TV)."
        fields:
          - { name: imagen, label: "Foto de fondo", widget: image }
          - { name: eyebrow, label: "Etiqueta pequeña", widget: string }
          - { name: titulo, label: "Título", widget: string }
          - { name: texto, label: "Texto", widget: text, required: false }
      - name: cierre
        label: "Cierre (última sección)"
        widget: object
        collapsed: true
        fields:
          - { name: imagen, label: "Foto de fondo", widget: image }
          - { name: eyebrow, label: "Etiqueta pequeña", widget: string }
          - { name: titulo, label: "Título", widget: string }
          - { name: titulo_destacado, label: "Parte del título en dorado", widget: string, required: false }
          - { name: texto, label: "Texto", widget: text }
          - { name: boton, label: "Texto del botón", widget: string }
          - { name: nota, label: "Nota junto al botón", widget: string, required: false }

  - name: preguntas
    label: "❓ Preguntas frecuentes"
    file: content/preguntas.json
    fields:
      - { name: eyebrow, label: "Etiqueta pequeña", widget: string }
      - { name: titulo, label: "Título", widget: string }
      - { name: titulo_destacado, label: "Parte del título en dorado", widget: string, required: false }
      - name: items
        label: "Preguntas"
        label_singular: "Pregunta"
        widget: list
        min: 1
        summary: "{{pregunta}}"
        fields:
          - { name: pregunta, label: "Pregunta", widget: string }
          - { name: respuesta, label: "Respuesta", widget: text }
